schema: lintpal.rules.v1
rules:
  - id: go.unchecked-error
    type: noul
    instructions: Does the changed Go code discard an error from a call whose failure should be handled or returned?
    criteria:
      "true": The changed code drops a meaningful error without handling it.
      "false": The error is handled, returned, or deliberately irrelevant with clear context.
    threshold: 0.95
    severity: high
    title: Possible unchecked error
    message: Review whether this call's error needs handling.
    paths: ['*.go']
    sides: [RIGHT]
  - id: go.command-input
    type: choice
    instructions: How is an operating-system command built in the changed code?
    criteria:
      safe: The command and its arguments come only from fixed, trusted values.
      risky: Untrusted input can control a shell command or executable argument.
    trigger_choices: [risky]
    threshold: 0.95
    severity: critical
    title: Untrusted command input
    message: Review command construction for unsafe input.
    paths: ['*.go']
    sides: [RIGHT]
  - id: go.review-complexity
    type: score
    instructions: How hard is the changed logic to review for correctness?
    criteria:
      - Straightforward local change with clear control flow.
      - Several interacting conditions require careful review.
      - Complex state or concurrency makes behavior hard to verify.
    threshold: 1.0
    severity: low
    title: Complex change
    message: Consider simplifying or adding focused verification.
    paths: ['*.go']
    sides: [RIGHT]
