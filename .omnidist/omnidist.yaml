profiles:
    default:
        enabled-distributions: [npm]
        tool:
            name: lintpal
            main: ./cmd/lintpal
        version:
            source: git-tag
        targets:
            - os: darwin
              arch: amd64
            - os: darwin
              arch: arm64
            - os: linux
              arch: amd64
            - os: linux
              arch: arm64
            - os: windows
              arch: amd64
        build:
            ldflags: -s -w -X main.version=${OMNIDIST_VERSION}
            tags: []
            cgo: false
        distributions:
            npm:
                package: lintpal
                aliases:
                    - '@diffpal/lintpal'
                platform-package: '@diffpal/lintpal'
                repository-url: git+https://github.com/diffpal/lintpal.git
                license: MIT
                registry: https://registry.npmjs.org
                access: public
                publish-auth: trusted
                include-readme: true
                keywords:
                    - jev
                    - lintpal
                    - code-review
                    - linter
                    - developer-tools
                    - github-actions
                    - git-diff
