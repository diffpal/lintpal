name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  correctness:
    name: Go correctness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: go-task/setup-task@v2
        with:
          version: 3.44.0
      - run: task build
      - run: task test
      - run: task vet
      - name: Format, offline validation, and race
        if: matrix.os == 'ubuntu-latest'
        run: |
          task format
          task eval
          task rule-validate
          task docs-verify
          task self-review-smoke
          task race
