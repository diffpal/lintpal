name: Stage distribution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate staging tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag || ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Dispatch this workflow on a SemVer tag' >&2
            exit 1
          fi
      - name: Build, stage, and verify
        run: |
          npx -y @omnidist/omnidist@0.1.37 build
          npx -y @omnidist/omnidist@0.1.37 stage
          npx -y @omnidist/omnidist@0.1.37 verify
      - name: Hash target binaries
        shell: bash
        run: |
          find .omnidist/default/dist -type f -name 'lintpal*' -print0 |
            sort -z | xargs -0 sha256sum > .omnidist/default/dist/checksums.txt
          test "$(wc -l < .omnidist/default/dist/checksums.txt)" -eq 5
      - name: Store staged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lintpal-staged-${{ github.ref_name }}
          path: |
            .omnidist/default/dist/
            .omnidist/default/npm/
          if-no-files-found: error
