# Generated by "omnidist ci" and customized for lintpal release gates.
name: omnidist-release
on:
  push:
    tags:
      - "v*"
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
concurrency:
  group: omnidist-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: go-task/setup-task@v2
        with:
          version: 3.44.0
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Expected a SemVer release tag such as v0.3.0' >&2
            exit 1
          fi
          test "$(git describe --tags --exact-match HEAD)" = "$GITHUB_REF_NAME"
      - name: Check source
        run: |
          task check
          task race
          task lint-go
          go mod verify
          go tool govulncheck ./...
      - name: Install omnidist
        run: npm install -g '@omnidist/omnidist@0.1.37'
      - name: Build artifacts
        run: omnidist --profile 'default' build
      - name: Stage artifacts
        run: omnidist --profile 'default' stage --only 'npm'
      - name: Verify artifacts
        run: omnidist --profile 'default' verify --only 'npm'
      - name: Pack staged artifacts
        run: tar -czf omnidist-staged.tgz .omnidist/default
      - name: Upload staged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnidist-staged
          path: omnidist-staged.tgz
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: .omnidist/default/dist/**/*
          if-no-files-found: error

  publish_npm:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Install npm with trusted publishing support
        run: npm install -g 'npm@^11.5.1'
      - name: Install omnidist
        run: npm install -g '@omnidist/omnidist@0.1.37'
      - name: Download staged artifacts
        uses: actions/download-artifact@v4
        with:
          name: omnidist-staged
      - name: Restore staged artifacts
        run: tar -xzf omnidist-staged.tgz
      - name: Verify tag and staged version
        run: test "$(cat .omnidist/default/dist/VERSION)" = "${GITHUB_REF_NAME#v}"
      - name: Verify publication plan
        run: omnidist --profile 'default' publish --dry-run
      - name: Publish npm artifacts
        run: omnidist --profile 'default' npm publish

  release:
    needs: publish_npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: .omnidist/default/dist
          merge-multiple: true
      - name: Verify tag and build version
        run: test "$(cat .omnidist/default/dist/VERSION)" = "${GITHUB_REF_NAME#v}"
      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          while IFS= read -r -d '' f; do
            rel="${f#.omnidist/default/dist/}"
            os="${rel%%/*}"
            rem="${rel#*/}"
            arch="${rem%%/*}"
            name="${rel##*/}"
            ext=""
            base="$name"
            if [[ "$name" == *.exe ]]; then
              ext=".exe"
              base="${name%.exe}"
            fi
            cp "$f" "release-assets/${base}-${os}-${arch}${ext}"
          done < <(find .omnidist/default/dist -type f ! -name VERSION -print0 | sort -z)
      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > checksums.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
