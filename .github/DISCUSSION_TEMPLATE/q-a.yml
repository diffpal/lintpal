title: "[Q&A] "
body:
  - type: markdown
    attributes:
      value: |
        Ask about installation, providers, rules, or CI setup. Remove secrets,
        private source, and proprietary diffs before posting.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to do, and where did you get stuck?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LintPal version
      placeholder: "0.5.4"
  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: Include a minimal command or sanitized output if it helps.
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, installation method, provider (no token)"
